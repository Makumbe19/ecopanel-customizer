[build]
  command = "npm run build"
  publish = "dist"

# Single-page app fallback so deep links work
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# (Optional) long-cache images/fonts
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
